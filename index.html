<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靈魂特調 Cafe ☕ 專屬你的屬靈充電指南</title>

        :root {
            --bg-apricot: #F7EBE1;      /* 溫暖杏色背景 */
            --card-cream: #FFFDF9;      /* 柔和奶油白 */
            --coffee-brown: #4A3525;    /* 溫潤深咖啡色 */
            --light-brown: #8C6D53;     /* 淺啡色 */
            --line-black: #2B2523;      /* 日系線條黑 */
            --accent-warm: #D98A6C;     /* 暖橘調點綴 */
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            /* 主要字體採用 Noto Serif TC (思源宋體) SemiBold */
            font-family: 'Noto Serif TC', serif;
            font-weight: 600;
            background-color: var(--bg-apricot);
            /* 日系微網點質感 */
            background-image: radial-gradient(var(--light-brown) 0.65px, transparent 0.65px);
            background-size: 16px 16px;
            color: var(--line-black);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
        }

        /* 容器卡片 */
        .app-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-cream);
            border: 2px solid var(--line-black);
            border-radius: 24px;
            box-shadow: 6px 6px 0px var(--coffee-brown);

            position: relative;
            overflow: hidden;

            border: 1.5px solid var(--line-black);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Klee One', 'Noto Serif TC', serif;
            background: var(--bg-apricot);
            margin-bottom: 12px;
            letter-spacing: 1.5px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-title {
            font-family: 'Noto Serif TC', serif;
            font-weight: 700;
            font-size: 28px;
            color: var(--coffee-brown);
            margin: 8px 0;
            letter-spacing: 1.5px;
            line-height: 1.3;
        }

        .sub-title {
            font-size: 14px;
            color: var(--light-brown);
            margin-bottom: 16px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .illustration-box-main {
            width: 100%;
            height: 180px;
            margin: 8px 0 16px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .illustration-box-main img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(2px 3px 0px rgba(74, 53, 37, 0.15));
        }

        .intro-text {
            font-size: 14.5px;
            line-height: 1.85;
            color: var(--coffee-brown);
            background: rgba(247, 235, 225, 0.5);
            padding: 14px 16px;
            border-radius: 16px;
            border: 1.5px solid var(--line-black);
            margin-bottom: 24px;
            font-weight: 600;
            width: 100%;
        }

        /* 按鈕樣式 */
        .btn-main {
            background: var(--coffee-brown);
            color: var(--card-cream);
            font-family: 'Noto Serif TC', serif;
            font-size: 17px;
            font-weight: 600;
            padding: 14px;
            border-radius: 30px;
            text-align: center;
            width: 100%;
            border: 2px solid var(--line-black);
            box-shadow: 4px 4px 0px var(--line-black);
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 1px;
        }

        .btn-main:hover {
            background: var(--light-brown);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--line-black);
        }

        .btn-main:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--line-black);
        }

        /* 返回按鈕樣式 */
        .btn-back {
            background: none;
            border: none;
            color: var(--light-brown);
            font-family: 'Noto Serif TC', serif;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s ease;
        }

        .btn-back:hover {
            color: var(--coffee-brown);
        }

        /* 2. 測驗頁面 */
        .quiz-screen { display: none; }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--light-brown);
            font-family: 'Klee One', serif;
        }

            width: 100%;
            height: 10px;
            background: var(--bg-apricot);
            border-radius: 10px;
            border: 1.5px solid var(--line-black);
            overflow: hidden;
            margin: 10px 0 20px 0;

            height: 100%;
            width: 14%;
            background: var(--coffee-brown);
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 15.5px;
            font-weight: 600;
            line-height: 1.75;
            margin-bottom: 20px;
            min-height: 52px;
            color: var(--coffee-brown);
        }

            display: flex;
            flex-direction: column;
            gap: 12px;
        }

            background: var(--card-cream);
            border: 1.5px solid var(--line-black);
            border-radius: 16px;
            padding: 12px 14px;
            font-size: 13.5px;
            font-family: 'Noto Serif TC', serif;
            font-weight: 600;
            color: var(--line-black);
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--line-black);

            text-align: left;
            line-height: 1.6;

            background: var(--bg-apricot);
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--line-black);
        }

            display: none;
            text-align: center;

            border-radius: 8px;
            padding: 18px 18px 24px 18px;
            box-shadow: 6px 6px 0px var(--coffee-brown);
            margin-bottom: 20px;
            position: relative;

            height: 200px;
            background: var(--bg-apricot);
            border: 1.5px solid var(--line-black);
            border-radius: 4px;

            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            padding: 10px;

            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.1));

            font-family: 'Noto Serif TC', serif;
            font-size: 21px;
            font-weight: 700;
            margin: 10px 0 6px 0;
            color: var(--coffee-brown);
            letter-spacing: 1px;

        .result-tag {
            font-size: 13px;
            color: var(--light-brown);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .result-desc {

            line-height: 1.75;
            color: var(--line-black);
            background: var(--card-cream);

            border-radius: 12px;
            border: 1px dashed var(--line-black);
            text-align: justify;
            margin-bottom: 12px;
            font-weight: 600;

            background: var(--bg-apricot);
            border: 1.5px solid var(--line-black);
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            line-height: 1.65;
            text-align: left;
            color: var(--coffee-brown);
            font-weight: 600;
        }

            font-family: 'Noto Serif TC', serif;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

            font-size: 11.5px;
            color: var(--light-brown);
            margin-top: 14px;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .action-group {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            font-size: 14.5px;
            padding: 12px;
        }

        .btn-restart {
            background: var(--bg-apricot);
            color: var(--coffee-brown);
        }
    </style>
</head>

<div class="app-container">

    <!-- ==================== 1. 主頁面 ==================== -->
    <div id="home-screen" class="home-screen">
        <div class="hand-drawn-badge">SOUL CAFE ✦ 靈魂特調</div>
        
        <h1 class="main-title">靈魂特調 Cafe</h1>

        <button class="btn-main" onclick="startQuiz()">開啟特調指南 ➔</button>
    </div>

    <!-- ==================== 2. 測驗頁面 ==================== -->
    <div id="quiz-screen" class="quiz-screen">

        <div class="progress-bar-container">

        </div>

    </div>

    <!-- ==================== 3. 結果頁面 (拍立得卡片) ==================== -->
    <div id="result-screen" class="result-screen">
        
        <!-- 可下載的拍立得卡片區域 -->
        <div id="capture-card" class="polaroid-card">

            <div class="polaroid-photo-frame">

            </div>

            <div class="card-footer-stamp">✦ SOUL CAFE 官方靈魂特調卡 ✦</div>
        </div>

        <!-- 按鈕群組 -->
        <div class="action-group">
            <button class="btn-main action-btn" onclick="downloadCard()">📸 保存特調卡</button>
            <button class="btn-main action-btn btn-restart" onclick="restartQuiz()">🪄 再調一杯</button>
        </div>
    </div>

</div>

            { text: "A. 當他遇到人生疑惑時，用很有邏輯與智慧的方式解答他的問題", type: "MACHA" },
            { text: "B. 送他一張我親手寫的祝福卡片，並默默在私底下持續為他禱告", type: "BLACK" },
            { text: "C. 用實際行動去幫忙他解決眼前的困難，用愛心服事他", type: "LATTE"},
            { text: "D. 邀請他一起去參加超酷的教會特會或敬拜晚會", type: "FRUIT" },
            { text: "E. 主動關心他的生活狀況，請他吃頓飯，做他最溫暖的傾聽者", type: "COCOA"  }
        ]
    }
];

let currentIndex = 0;
let scores = { BLACK: 0, FRUIT: 0, COCOA: 0, MACHA: 0, LATTE: 0 };
let userHistory = []; // 紀錄用戶每題選擇的答案類型，方便退回上一題時扣除分數

function startQuiz() {
    currentIndex = 0;
    scores = { BLACK: 0, FRUIT: 0, COCOA: 0, MACHA: 0, LATTE: 0 };
    userHistory = [];
    document.getElementById("home-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    showQuestion();
}

function showQuestion() {
    const q = questions[currentIndex];
    const progressPercent = ((currentIndex + 1) / questions.length) * 100;
    
    document.getElementById("progress-bar").style.width = `${progressPercent}%`;
    document.getElementById("progress-text").innerText = `${String(currentIndex + 1).padStart(2, '0')} / 07`;
    document.getElementById("question-text").innerText = q.text;

    const container = document.getElementById("options-container");
    container.innerHTML = "";

    q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt.text;
        btn.onclick = () => handleSelect(opt.type);
        container.appendChild(btn);
    });
}

function handleSelect(type) {
    scores[type]++;
    userHistory.push(type);
    currentIndex++;
    if (currentIndex < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function prevQuestion() {
    if (currentIndex === 0) {
        // 第一題按返回：回到首頁
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("home-screen").style.display = "flex";
    } else {
        // 退回前一題並扣除相應的分數
        currentIndex--;
        const lastSelectedType = userHistory.pop();
        if (lastSelectedType && scores[lastSelectedType] > 0) {
            scores[lastSelectedType]--;
        }
        showQuestion();
    }
}

function showResult() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";

    let bestType = "BLACK";
    let max = -1;
    for (const key in scores) {
        if (scores[key] > max) {
            max = scores[key];
            bestType = key;
        }
    }

    const res = results[bestType];
    document.getElementById("result-img").src = coffeeImages[bestType];
    document.getElementById("result-title").innerText = res.title;
    document.getElementById("result-tag").innerText = res.tag;
    document.getElementById("result-desc").innerText = res.desc;
    document.getElementById("result-devotion").innerText = res.devotion;
}

function downloadCard() {
    const card = document.getElementById("capture-card");
    html2canvas(card, { scale: 3, backgroundColor: null }).then(canvas => {
        const a = document.createElement('a');
        a.download = 'SOUL_CAFE_SPECIAL.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
    });
}

function restartQuiz() {
    currentIndex = 0;
    scores = { BLACK: 0, FRUIT: 0, COCOA: 0, MACHA: 0, LATTE: 0 };
    userHistory = [];
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("home-screen").style.display = "flex";
}
</script>
